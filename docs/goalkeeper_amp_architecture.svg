<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="2020" viewBox="0 0 1740 2020" role="img" aria-labelledby="title desc">
  <title id="title">K1 Goalkeeper AMP 接入设计与两人分工架构图</title>
  <desc id="desc">设计方案而非已实现状态。一个Actor和六个按动作类别路由的判别器；专家数据与策略数据使用相同的22个绝对关节角、两帧0.02秒间隔的特征。展示专家采样、环境观测、历史缓冲、带类别的回放缓冲、判别器训练、风格奖励与PPO更新，以及两人的模块责任边界。</desc>
  <defs>
    <style>
      text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#233248; }
      .title { font-size:33px; font-weight:700; }
      .section { font-size:25px; font-weight:700; }
      .head { font-size:22px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:17px; fill:#526176; }
      .code { font-family:"DejaVu Sans Mono",monospace; font-size:16px; fill:#506078; }
      .panel { fill:#fff; stroke:#dce3ec; stroke-width:2; }
      .a { fill:#edf5ff; stroke:#7aa7dd; stroke-width:2; }
      .b { fill:#f4effc; stroke:#ac94ce; stroke-width:2; }
      .shared { fill:#fff8e9; stroke:#d5b16c; stroke-width:2; }
      .existing { fill:#eff9f3; stroke:#88b49a; stroke-width:2; }
      .flow { fill:none; stroke:#526b87; stroke-width:2.4; marker-end:url(#arrow); }
      .train { fill:none; stroke:#8b70b1; stroke-width:2.4; stroke-dasharray:8 5; marker-end:url(#purpleArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#526b87"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8b70b1"/></marker>
  </defs>
  <rect width="1740" height="2020" fill="#f3f6fa"/>
  <text x="45" y="57" class="title">K1 Goalkeeper · AMP 接入架构与两人分工</text>
  <text x="45" y="94" class="body">设计方案 · 2026-10-31 ｜ 一个 Actor + 六个判别器，不是六个控制策略</text>
  <rect x="45" y="113" width="20" height="20" rx="4" class="a"/><text x="75" y="130" class="small">你：数据与环境端</text>
  <rect x="310" y="113" width="20" height="20" rx="4" class="b"/><text x="340" y="130" class="small">队友：判别器与学习端</text>
  <rect x="610" y="113" width="20" height="20" rx="4" class="shared"/><text x="640" y="130" class="small">共同约定 / 联调</text>
  <rect x="870" y="113" width="20" height="20" rx="4" class="existing"/><text x="900" y="130" class="small">已有基础，可复用或适配</text>
  <line x1="1250" y1="122" x2="1290" y2="122" stroke="#526b87" stroke-width="2.4"/><text x="1300" y="130" class="small">数据流</text>
  <line x1="1430" y1="122" x2="1470" y2="122" stroke="#8b70b1" stroke-width="2.4" stroke-dasharray="8 5"/><text x="1480" y="130" class="small">训练 / 参数更新</text>

  <!-- Shared contract -->
  <rect x="25" y="158" width="1690" height="200" rx="16" class="panel"/>
  <text x="45" y="197" class="section">① 先固定接口：参考运动与实际运动必须使用同一套特征</text>
  <rect x="45" y="219" width="1650" height="117" rx="10" class="shared"/>
  <text x="65" y="250" class="body">串联 K1：22 个绝对关节角（rad）｜固定名称顺序｜两帧间隔 0.02 s｜旧帧在前</text>
  <text x="65" y="282" class="body">单帧 q：(B, 22) → 两帧窗口：(B, 2, 22) → 展平 x = [q(t−1), q(t)]：(B, 44)</text>
  <text x="65" y="314" class="small">类别 g：0 lefthand · 1 righthand · 2 leftjump · 3 rightjump · 4 leftstep · 5 rightstep（整数标签，非 Actor 新输入）</text>

  <!-- Parallel data paths -->
  <rect x="25" y="380" width="1690" height="850" rx="16" class="panel"/>
  <text x="45" y="420" class="section">② 两条运动数据流汇入判别器：一条来自参考 clips，一条来自策略的实际运动</text>

  <text x="45" y="460" class="head">专家数据：你负责准备与采样</text>
  <text x="610" y="460" class="head">策略数据：环境与历史分开负责</text>
  <text x="1175" y="460" class="head">学习端：队友负责分类、训练与奖励</text>

  <rect x="45" y="480" width="520" height="150" rx="11" class="a"/>
  <text x="65" y="512" class="head">已 retarget 的六个 K1 clips</text>
  <text x="65" y="548" class="code">artifacts/goalkeeper_k1/serial/*.pkl</text>
  <text x="65" y="580" class="small">读取、关节名称映射、单位与参考姿态核对</text>
  <text x="65" y="610" class="small">当前训练用串联 22 关节，不混入并联 34 列</text>

  <path d="M305 630 V680" class="flow"/>
  <rect x="45" y="685" width="520" height="185" rx="11" class="a"/>
  <text x="65" y="717" class="head">按类别采样 expert 窗口</text>
  <text x="65" y="753" class="body">输入：类别 g、样本数 B</text>
  <text x="65" y="786" class="body">输出：参考关节角 (B, 2, 22)</text>
  <text x="65" y="819" class="small">按 0.02 s 时间间隔插值；不能跨 clip 拼接</text>
  <text x="65" y="849" class="small">片段起点与采样权重明确，不盲目拼成循环动作</text>

  <path d="M305 870 V920" class="flow"/>
  <rect x="45" y="925" width="520" height="135" rx="11" class="a"/>
  <text x="65" y="957" class="head">专家接口与一致性测试</text>
  <text x="65" y="993" class="body">提供 g 和 expert_x：(B, 44)</text>
  <text x="65" y="1025" class="small">参考与仿真同姿态应生成相同的单帧特征</text>

  <rect x="610" y="480" width="520" height="150" rx="11" class="existing"/>
  <text x="630" y="512" class="head">现有 Actor → Action → 物理仿真</text>
  <text x="630" y="548" class="body">Actor 观测 → 22 维动作 → 关节目标</text>
  <text x="630" y="580" class="small">PD 电机、重力与接触产生实际运动</text>
  <text x="630" y="610" class="small">AMP 不会把机器人逐帧强制写成参考姿态</text>

  <path d="M870 630 V680" class="flow"/>
  <rect x="610" y="685" width="520" height="185" rx="11" class="a"/>
  <text x="630" y="717" class="head">新增独立 amp 观测 + 类别接口</text>
  <text x="630" y="753" class="body">实际 q_t：(num_envs, 22)</text>
  <text x="630" y="786" class="body">当前射门类别 g：(num_envs,)</text>
  <text x="630" y="819" class="small">amp 组只供判别器使用，不拼入 Actor 输入</text>
  <text x="630" y="849" class="small">你负责单帧 / 类别；同时核对来球与动作类别</text>

  <path d="M870 870 V920" class="flow"/>
  <rect x="610" y="925" width="520" height="135" rx="11" class="b"/>
  <text x="630" y="957" class="head">策略历史缓冲 → policy_x</text>
  <text x="630" y="993" class="body">每个环境保留最近两帧 → (num_envs, 44)</text>
  <text x="630" y="1025" class="small">reset 清除对应历史；不拼接两个回合的数据</text>

  <path d="M870 1060 V1100" class="flow"/>
  <rect x="610" y="1105" width="520" height="95" rx="11" class="b"/>
  <text x="630" y="1137" class="head">AMP Replay Buffer</text>
  <text x="630" y="1173" class="small">存许多 (类别 g, 运动片段 x)，供判别器抽样训练</text>

  <rect x="1175" y="480" width="520" height="150" rx="11" class="b"/>
  <text x="1195" y="512" class="head">类别路由 + 一致的特征归一化</text>
  <text x="1195" y="548" class="body">同一类别 g 的 expert 与 policy 配对</text>
  <text x="1195" y="580" class="small">归一化口径一致；不得靠来源格式差异分类</text>
  <text x="1195" y="610" class="small">类别属于样本元数据，不从关节姿态猜测</text>

  <path d="M1435 630 V680" class="flow"/>
  <rect x="1175" y="685" width="520" height="185" rx="11" class="b"/>
  <text x="1195" y="717" class="head">六个判别器 D_g：评价运动，不控制关节</text>
  <text x="1195" y="755" class="body">D_lefthand       D_righthand</text>
  <text x="1195" y="790" class="body">D_leftjump      D_rightjump</text>
  <text x="1195" y="825" class="body">D_leftstep       D_rightstep</text>
  <text x="1195" y="852" class="small">每个判别器区分对应类别的参考样本与策略样本</text>

  <!-- Input routes go through gutters to keep labels unobstructed -->
  <path d="M565 993 H585 V650 H1150 V530 H1175" class="flow"/>
  <path d="M1130 1152 H1155 V595 H1175" class="flow"/>
  <path d="M1130 993 H1142 V890 H1435 V870" class="flow"/>
  <text x="1195" y="916" class="small">当前有效片段用于计奖；Replay 样本用于训练</text>

  <path d="M1435 870 V950" class="flow"/>
  <rect x="1175" y="955" width="520" height="105" rx="11" class="b"/>
  <text x="1195" y="987" class="head">风格奖励 r_AMP = f(D_g(x))</text>
  <text x="1195" y="1023" class="small">运动越像对应参考，通常得到越高的风格奖励</text>

  <rect x="45" y="1105" width="520" height="95" rx="11" class="shared"/>
  <text x="65" y="1137" class="head">类别 / 时间窗口 / 阶段约定</text>
  <text x="65" y="1173" class="small">两人共同锁定，再分别用假数据测试各自模块</text>

  <!-- Learning loops -->
  <rect x="25" y="1255" width="1690" height="455" rx="16" class="panel"/>
  <text x="45" y="1295" class="section">③ 两个学习循环同时运行：判别器学习“分辨”，PPO 学习“获得奖励”</text>

  <rect x="45" y="1325" width="520" height="145" rx="11" class="existing"/>
  <text x="65" y="1357" class="head">原有环境任务奖励 r_task</text>
  <text x="65" y="1393" class="body">扑救、稳定、脚部、恢复等 22 项</text>
  <text x="65" y="1425" class="small">AMP 不替代挡球目标，也不自动修复不可达来球</text>
  <text x="65" y="1454" class="small">终止与 reset 仍由环境管理</text>

  <path d="M565 1395 H605" class="flow"/>
  <rect x="610" y="1325" width="520" height="145" rx="11" class="b"/>
  <text x="630" y="1357" class="head">Runner 组合奖励</text>
  <text x="630" y="1393" class="body">r_total = α · r_task + β · r_AMP</text>
  <text x="630" y="1425" class="small">明确 dt / 数值尺度、权重、阶段 mask</text>
  <text x="630" y="1454" class="small">先不因加入 AMP 而同时改动全部任务奖励</text>
  <path d="M1435 1060 V1220 H1710 V1308 H870 V1325" class="flow"/>

  <rect x="1175" y="1325" width="520" height="145" rx="11" class="b"/>
  <text x="1195" y="1357" class="head">判别器训练：expert vs policy</text>
  <text x="1195" y="1393" class="body">按 g 抽样 → 分类损失 / 正则 → 更新 D_g</text>
  <text x="1195" y="1425" class="small">更新判别器参数与相应归一化统计</text>
  <text x="1195" y="1454" class="small">不会把仿真中的机器人直接改成参考动作</text>
  <path d="M1680 870 H1705 V1310 H1435 V1325" class="train"/>
  <path d="M1695 1395 H1728 V760 H1695" class="train"/>

  <path d="M870 1470 V1510" class="flow"/>
  <rect x="610" y="1515" width="520" height="160" rx="11" class="b"/>
  <text x="630" y="1547" class="head">PPO Rollout Buffer → 更新 Actor / Critic</text>
  <text x="630" y="1583" class="small">存 obs、action、总奖励、done、value</text>
  <text x="630" y="1615" class="small">计算回报 / GAE，使用 PPO loss 更新策略</text>
  <text x="630" y="1647" class="small">不通过 MuJoCo 把判别器梯度反传到动作</text>
  <path d="M610 1590 H595 V540 H610" class="train"/>

  <rect x="45" y="1515" width="520" height="160" rx="11" class="a"/>
  <text x="65" y="1547" class="head">你负责：环境联调与行为评估</text>
  <text x="65" y="1583" class="small">新 AMP task；六类来球与可达性核对</text>
  <text x="65" y="1615" class="small">固定场景对比 PPO baseline 与 AMP</text>
  <text x="65" y="1647" class="small">看站稳、响应方向、拦截与倒地，不只看总 reward</text>

  <rect x="1175" y="1515" width="520" height="160" rx="11" class="b"/>
  <text x="1195" y="1547" class="head">队友负责：checkpoint 与学习日志</text>
  <text x="1195" y="1583" class="small">保存 / 加载六个 D、归一化、Actor / Critic</text>
  <text x="1195" y="1615" class="small">区分 PPO warm start 与完整 AMP resume</text>
  <text x="1195" y="1647" class="small">每类 D loss / 分数、style 与 task 奖励尺度</text>

  <!-- Implementation scope and key safeguards -->
  <rect x="25" y="1735" width="1690" height="260" rx="16" class="panel"/>
  <text x="45" y="1775" class="section">④ 实施边界与必须共同确认的事项</text>
  <text x="45" y="1813" class="body">可复用：现有 amp/ 的判别器、历史 / replay 思路、PPO 与 Runner 基础；不直接套用 velocity 的腿部特征与 reset。</text>
  <text x="45" y="1849" class="body">共同决定：终止步 / reset 样本是否计奖与入库、类别何时读取、恢复阶段是否继续 AMP，以及参考片段的覆盖范围。</text>
  <text x="45" y="1885" class="body">部署只需要 Actor 和观测 / 控制适配；判别器、专家数据与训练缓冲通常不随策略部署。</text>
  <text x="45" y="1927" class="small">状态说明：蓝 / 紫色模块表示两人的计划交付，不代表已实现；当前注册的 goalkeeper 仍是普通 PPO。</text>
  <text x="45" y="1960" class="small">历史缓冲 = 拼最近两帧；AMP Replay = 存运动片段训练 D；PPO Rollout = 存交互轨迹训练策略。三者职责不同。</text>
</svg>
