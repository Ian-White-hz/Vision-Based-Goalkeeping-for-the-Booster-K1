<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1870" viewBox="0 0 1740 1870" role="img" aria-labelledby="title desc">
  <title id="title">Goalkeeper AMP 分工图 V2：Part A 学习算法与训练集成，Part B 数据与环境</title>
  <desc id="desc">2026年10月31日的计划分工。Part A 负责 AMP 学习算法与训练集成，Part B 负责参考数据与环境接口；通过固定接口和模拟数据独立开发。图中包含文件归属、测试责任、reset 语义和四个共同里程碑，不表示代码已经实现。</desc>
  <defs>
    <style>
      text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#24344a; }
      .title { font-size:33px; font-weight:700; }
      .section { font-size:25px; font-weight:700; }
      .head { font-size:22px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:17px; fill:#536379; }
      .code { font-family:"DejaVu Sans Mono",monospace; font-size:16px; fill:#526278; }
      .panel { fill:#fff; stroke:#dce4ee; stroke-width:2; }
      .part-a { fill:#f3effc; stroke:#a18ac9; stroke-width:2; }
      .part-b { fill:#edf5ff; stroke:#79a7db; stroke-width:2; }
      .joint { fill:#fff7e7; stroke:#cfac65; stroke-width:2; }
      .done { fill:#eff8f3; stroke:#86b29a; stroke-width:2; }
      .line { fill:none; stroke:#5b718d; stroke-width:2.5; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5b718d"/></marker>
  </defs>
  <rect width="1740" height="1870" fill="#f3f6fa"/>
  <text x="45" y="56" class="title">Goalkeeper AMP · 分工与接口图 V2</text>
  <text x="45" y="94" class="body">2026-10-31 ｜ Part A：学习算法与训练集成　｜　Part B：参考数据与环境接口</text>
  <text x="45" y="126" class="small">本图定义计划交付、接口边界与联合里程碑，不表示 AMP 已实现。</text>

  <!-- Responsibility lanes -->
  <rect x="25" y="150" width="1690" height="590" rx="17" class="panel"/>
  <text x="45" y="190" class="section">① 并行工作包：各部分分别承担设计、实现、测试与交付</text>

  <rect x="45" y="215" width="790" height="490" rx="13" class="part-a"/>
  <text x="67" y="251" class="section">Part A：AMP 学习算法与训练集成</text>
  <text x="67" y="293" class="head">A1　学习端数据适配与特征归一化</text>
  <text x="99" y="323" class="small">接收 Part B 的原始特征 / expert 窗口；统一展平、检查与归一化</text>
  <text x="67" y="365" class="head">A2　策略历史缓冲与带类别的 Replay Buffer</text>
  <text x="99" y="395" class="small">拼接实际运动窗口；保留类别；处理 done，防止跨回合污染</text>
  <text x="67" y="437" class="head">A3　六个判别器、损失函数与参数更新</text>
  <text x="99" y="467" class="small">按类别采样与路由；分类损失、正则、梯度与训练稳定性</text>
  <text x="67" y="509" class="head">A4　AMP 奖励、PPO / Runner 与模型恢复</text>
  <text x="99" y="539" class="small">奖励尺度与阶段开关；PPO warm start、AMP 保存 / 续训</text>
  <text x="67" y="581" class="head">A5　算法诊断与消融实验主责</text>
  <text x="99" y="611" class="small">每类 D loss / 分数；task / style 比例；有无 AMP、权重等对比</text>
  <text x="67" y="659" class="body">交付：可训练、可恢复、可解释的 AMP 学习系统</text>
  <text x="67" y="688" class="small">验收重点：损失与梯度正确、训练可恢复、实验结果可追溯。</text>

  <rect x="905" y="215" width="790" height="490" rx="13" class="part-b"/>
  <text x="927" y="251" class="section">Part B：参考数据与环境接口</text>
  <text x="927" y="293" class="head">B1　六个 clip 的 expert 采样接口</text>
  <text x="959" y="323" class="small">读取、类别映射、关节顺序、单位与时间重采样；不跨 clip 拼帧</text>
  <text x="927" y="365" class="head">B2　环境 amp 观测与 motion_id</text>
  <text x="959" y="395" class="small">输出实际单帧关节角和类别；不把 AMP 特征额外塞进 Actor</text>
  <text x="927" y="437" class="head">B3　来球、拦截点与参考动作类别对齐</text>
  <text x="959" y="467" class="small">修正过高 / 不可达来球；核对拦截平面类别，不只看球门落点</text>
  <text x="927" y="509" class="head">B4　AMP 环境配置、任务注册与 reset 接口</text>
  <text x="959" y="539" class="small">复用现有环境，新增独立 AMP task；接入 Part A 的 Runner / RL cfg</text>
  <text x="927" y="581" class="head">B5　环境验证、行为统计与可视化</text>
  <text x="959" y="611" class="small">类别覆盖、关节特征一致性、倒地 / 拦截指标，支撑联合实验</text>
  <text x="927" y="659" class="body">交付：语义一致、可采样、可评估的数据与环境</text>
  <text x="927" y="688" class="small">验收重点：数据与仿真特征一致、类别有效、环境指标可验证。</text>

  <!-- Shared interface -->
  <path d="M440 740 V775" class="line"/>
  <path d="M1300 740 V775" class="line"/>
  <rect x="25" y="780" width="1690" height="310" rx="17" class="joint"/>
  <text x="45" y="819" class="section">② 先共同锁定接口，再各自开发：维度相同不代表语义相同</text>
  <text x="45" y="861" class="head">Part B → Part A：数据接口</text>
  <text x="45" y="896" class="body">实际 q_t：(N, 22)　｜　motion_id：(N,)　｜　done / reset 信息：(N,)</text>
  <text x="45" y="931" class="body">参考 sample(g, B) → (B, 2, 22)；由 Part A 展平为 (B, 44)</text>
  <text x="45" y="973" class="head">Part A / Part B：共同约定</text>
  <text x="45" y="1008" class="body">串联 K1；固定 22 关节顺序；绝对角度 rad；两帧间隔 0.02 s；旧帧在前；不提前做统计归一化</text>
  <text x="45" y="1046" class="small">类别 0–5：lefthand / righthand / leftjump / rightjump / leftstep / rightstep。统计归一化统一由 Part A 负责。</text>
  <text x="45" y="1076" class="small">共同决定：done 样本如何计奖 / 入库，旧回合类别如何处理，以及恢复阶段是否继续 AMP；不能将旧类别配到 reset 后的新观测。</text>

  <!-- Independent development and ownership -->
  <rect x="25" y="1115" width="1690" height="310" rx="17" class="panel"/>
  <text x="45" y="1155" class="section">③ 独立开发与文件归属：使用模拟接口并行验证</text>
  <rect x="45" y="1180" width="790" height="215" rx="11" class="part-a"/>
  <text x="67" y="1214" class="head">Part A：使用模拟输入开发</text>
  <text x="67" y="1250" class="body">假关节轨迹 + 假类别 + 假 expert → 缓冲 / D / PPO</text>
  <text x="67" y="1283" class="small">测试：类别路由、历史不串回合、参数确实更新、保存 / 加载一致</text>
  <text x="67" y="1323" class="head">文件主责</text>
  <text x="67" y="1355" class="code">AMP modules / algorithms / runners + goalkeeper RL cfg</text>
  <text x="67" y="1383" class="small">创建 loader 的学习端适配入口由 Part A 维护，避免交叉修改核心代码。</text>

  <rect x="905" y="1180" width="790" height="215" rx="11" class="part-b"/>
  <text x="927" y="1214" class="head">Part B：使用模拟消费者验证输出</text>
  <text x="927" y="1250" class="body">真实 clips + 仿真状态 → 用假消费者检查输出</text>
  <text x="927" y="1283" class="small">测试：关节名称与单位、时间间隔、类别、reset、球的拦截分布</text>
  <text x="927" y="1323" class="head">文件主责</text>
  <text x="927" y="1355" class="code">expert sampler / amp obs / scene / env cfg / task registry</text>
  <text x="927" y="1383" class="small">新采样器优先独立放置；公共 MotionLoader 如需修改，先约定唯一负责人。</text>

  <!-- Milestones -->
  <rect x="25" y="1450" width="1690" height="260" rx="17" class="panel"/>
  <text x="45" y="1490" class="section">④ 四个交付点：先证明正确，再增加复杂度</text>
  <rect x="45" y="1520" width="370" height="120" rx="11" class="joint"/>
  <text x="65" y="1553" class="head">M0　接口冻结</text>
  <text x="65" y="1587" class="small">名称、形状、时间、类别、reset 语义</text>
  <text x="65" y="1618" class="small">双方各有一份可运行的假接口</text>
  <path d="M415 1580 H465" class="line"/>
  <rect x="470" y="1520" width="370" height="120" rx="11" class="done"/>
  <text x="490" y="1553" class="head">M1　独立模块通过</text>
  <text x="490" y="1587" class="small">Part A / Part B 各自模块测试通过</text>
  <text x="490" y="1618" class="small">不以“训练能启动”代替模块验证</text>
  <path d="M840 1580 H890" class="line"/>
  <rect x="895" y="1520" width="370" height="120" rx="11" class="joint"/>
  <text x="915" y="1553" class="head">M2　单类别短训练</text>
  <text x="915" y="1587" class="small">真实 expert 与实际运动接通</text>
  <text x="915" y="1618" class="small">验证判别器更新与奖励进入 PPO</text>
  <path d="M1265 1580 H1315" class="line"/>
  <rect x="1320" y="1520" width="375" height="120" rx="11" class="joint"/>
  <text x="1340" y="1553" class="head">M3　六类别与对比实验</text>
  <text x="1340" y="1587" class="small">六判别器、完整保存恢复、分类日志</text>
  <text x="1340" y="1618" class="small">与原 PPO baseline 比较实际行为</text>
  <text x="45" y="1680" class="small">联合实验：Part A 主导算法假设与消融；Part B 主导场景有效性与行为指标；共同完成结果分析与问题定位。</text>

  <rect x="25" y="1735" width="1690" height="110" rx="15" class="joint"/>
  <text x="45" y="1772" class="head">保持范围：一个 Actor + 六个判别器；保留普通 PPO baseline；不同时混入并联模型或真实视觉改造</text>
  <text x="45" y="1808" class="small">可复用现有 AMP 基础，但不直接复制 velocity 的腿部特征与 reset。工作量按完整交付与调试难度衡量，不按文件数或代码行数衡量。</text>
</svg>
