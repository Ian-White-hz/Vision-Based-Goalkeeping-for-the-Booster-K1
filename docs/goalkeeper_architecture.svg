<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2040" viewBox="0 0 1800 2040" role="img" aria-labelledby="title desc">
  <title id="title">Booster K1 Goalkeeper 当前架构图</title>
  <desc id="desc">截至2026年10月30日的代码结构：任务注册与配置装配、单策略PPO训练闭环、射门状态与奖励、离线动作重定向，以及尚未接入的AMP、真实视觉和部署模块。实线为已接入，虚线为待接入。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill:#203047; }
      .title { font-size:34px; font-weight:700; }
      .section { font-size:25px; font-weight:700; }
      .heading { font-size:22px; font-weight:700; }
      .body { font-size:20px; }
      .small { font-size:17px; fill:#526278; }
      .code { font-family:"DejaVu Sans Mono",monospace; font-size:16px; fill:#466078; }
      .panel { fill:#fff; stroke:#dce4ed; stroke-width:2; }
      .blue { fill:#edf5ff; stroke:#83ade3; stroke-width:2; }
      .green { fill:#effaf5; stroke:#7dbb9d; stroke-width:2; }
      .amber { fill:#fff8e9; stroke:#d2ae68; stroke-width:2; }
      .planned { fill:#f6f4fc; stroke:#a599c6; stroke-width:2; stroke-dasharray:8 6; }
      .arrow { fill:none; stroke:#52769a; stroke-width:2.5; marker-end:url(#arrow); }
      .dasharrow { fill:none; stroke:#9281b4; stroke-width:2.5; stroke-dasharray:8 6; marker-end:url(#futureArrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52769a"/></marker>
    <marker id="futureArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9281b4"/></marker>
  </defs>
  <rect width="1800" height="2040" fill="#f3f6fa"/>
  <text x="50" y="57" class="title">Booster K1 Goalkeeper · 当前架构</text>
  <text x="50" y="91" class="small">代码快照：2026-10-30 ｜ 当前训练：串联 K1、单个 Actor、普通 PPO，尚未接入 AMP</text>
  <line x1="1295" y1="51" x2="1345" y2="51" stroke="#52769a" stroke-width="3"/>
  <text x="1355" y="57" class="small">已接入</text>
  <line x1="1480" y1="51" x2="1530" y2="51" stroke="#9281b4" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1540" y="57" class="small">待接入</text>

  <!-- Configuration assembly -->
  <rect x="30" y="120" width="1740" height="435" rx="18" class="panel"/>
  <text x="55" y="158" class="section">① 配置装配：先描述环境，再创建运行实例</text>
  <rect x="55" y="185" width="495" height="125" rx="12" class="blue"/>
  <text x="75" y="215" class="heading">命令入口与任务注册</text>
  <text x="75" y="246" class="code">scripts/train.py → mjlab task registry</text>
  <text x="75" y="275" class="small">任务 ID：Mjlab-Goalkeeper-Flat-Booster-K1</text>
  <text x="75" y="298" class="code">tasks/goalkeeper/config/k1/__init__.py</text>

  <path d="M550 247 H600" class="arrow"/>
  <rect x="605" y="185" width="555" height="125" rx="12" class="blue"/>
  <text x="625" y="215" class="heading">K1 专属装配层</text>
  <text x="625" y="246" class="code">config/k1/env_cfgs.py</text>
  <text x="625" y="275" class="small">组装 scene + 通用 cfg，补齐机器人相关参数</text>
  <text x="625" y="298" class="small">动作 scale、发球事件、脚部传感器、任务奖励</text>

  <path d="M1160 247 H1210" class="arrow"/>
  <rect x="1215" y="185" width="530" height="125" rx="12" class="green"/>
  <text x="1235" y="215" class="heading">最终运行对象</text>
  <text x="1235" y="246" class="code">ManagerBasedRlEnvCfg → Env</text>
  <text x="1235" y="275" class="small">mjlab 根据 cfg 创建场景与各个 Manager</text>
  <text x="1235" y="298" class="small">并行环境数量等参数可由训练命令覆盖</text>

  <rect x="55" y="355" width="495" height="170" rx="12" class="panel"/>
  <text x="75" y="385" class="heading">任务通用配置</text>
  <text x="75" y="415" class="code">goalkeeper_env_cfg.py</text>
  <text x="75" y="447" class="body">观测组、关节动作、基础奖励、timeout</text>
  <text x="75" y="479" class="small">配置引用 mdp 中的函数或有状态类</text>
  <text x="75" y="508" class="small">cfg 管“用什么、参数多少”，mdp 管“怎么算”</text>
  <path d="M500 355 L700 310" class="arrow"/>

  <rect x="605" y="355" width="555" height="170" rx="12" class="panel"/>
  <text x="625" y="385" class="heading">场景与机器人资产</text>
  <text x="625" y="415" class="code">scene/{settings,assets,scene_cfg}.py</text>
  <text x="625" y="447" class="body">robot + ball + goal + 平地</text>
  <text x="625" y="479" class="small">串联 K1：22 个受控关节；足球参与碰撞</text>
  <text x="625" y="508" class="small">球门当前为视觉几何，不启用碰撞</text>
  <path d="M882 355 V310" class="arrow"/>

  <rect x="1215" y="355" width="530" height="170" rx="12" class="panel"/>
  <text x="1235" y="385" class="heading">学习器配置与 Runner</text>
  <text x="1235" y="415" class="code">config/k1/rl_cfg.py + rl/runner.py</text>
  <text x="1235" y="447" class="body">BoosterOnPolicyRunner → PPO</text>
  <text x="1235" y="479" class="small">网络、rollout 长度、优化器、日志、模型导出</text>
  <text x="1235" y="508" class="small">目前不包含动作判别器或 AMP 奖励</text>
  <path d="M1480 355 V310" class="arrow"/>

  <!-- Training data flow -->
  <rect x="30" y="580" width="1740" height="970" rx="18" class="panel"/>
  <text x="55" y="620" class="section">② 运行闭环：观测 → 策略 → 电机 → 动力学 → 奖励与终止 → PPO 更新</text>

  <rect x="55" y="650" width="520" height="285" rx="12" class="blue"/>
  <text x="75" y="681" class="heading">ObservationManager · 输入</text>
  <text x="75" y="715" class="body">Actor：92 维</text>
  <text x="75" y="745" class="small">球测量 [x, y, z, valid] × 5 帧 = 20</text>
  <text x="75" y="773" class="small">重力投影 3 + 基座角速度 3</text>
  <text x="75" y="801" class="small">相对关节角 22 + 关节速度 22 + 上次动作 22</text>
  <text x="75" y="838" class="body">Critic：95 维 = Actor + 球真值位置 3</text>
  <text x="75" y="872" class="small">当前球测量由仿真真值构造，不是真实视觉</text>
  <text x="75" y="904" class="code">mdp/observations.py</text>

  <path d="M575 790 H625" class="arrow"/>
  <rect x="630" y="650" width="495" height="285" rx="12" class="blue"/>
  <text x="650" y="681" class="heading">Actor / Critic · 单个策略</text>
  <text x="650" y="719" class="body">Actor MLP → 22 维关节动作</text>
  <text x="650" y="752" class="body">Critic MLP → 状态价值 V(s)</text>
  <text x="650" y="791" class="small">隐藏层：512 → 256 → 128，ReLU</text>
  <text x="650" y="820" class="small">观测归一化；Actor 使用高斯动作分布</text>
  <text x="650" y="861" class="small">六种来球类别共用一个 Actor</text>
  <text x="650" y="890" class="small">不是先分类，再调用六个独立 policy</text>

  <path d="M1125 790 H1175" class="arrow"/>
  <rect x="1180" y="650" width="565" height="285" rx="12" class="green"/>
  <text x="1200" y="681" class="heading">ActionManager → MuJoCo / Warp</text>
  <text x="1200" y="719" class="body">q_target = q_default + scale × action</text>
  <text x="1200" y="752" class="body">关节目标 → PD 电机 → 力矩 → 实际运动</text>
  <text x="1200" y="791" class="small">物理 200 Hz；控制 50 Hz；decimation = 4</text>
  <text x="1200" y="820" class="small">重力、碰撞、摩擦决定机器人和球的状态</text>
  <text x="1200" y="861" class="small">脚部接触传感器：接触力、接触状态、空中时间</text>
  <text x="1200" y="890" class="small">机器人根位姿并非由参考动作逐帧强制写入</text>

  <!-- Feedback connects physics to observations -->
  <path d="M1690 935 V965 H105 V935" class="arrow"/>
  <rect x="640" y="948" width="475" height="30" fill="#fff"/>
  <text x="653" y="970" class="small">实际仿真状态 / 传感器数据 → 下一步观测</text>

  <rect x="55" y="1010" width="520" height="240" rx="12" class="amber"/>
  <text x="75" y="1041" class="heading">Events · 发球与 reset</text>
  <text x="75" y="1077" class="small">六区域采样 / 滚地球 → 初始位置与初速度</text>
  <text x="75" y="1106" class="small">goal_target：球门平面的瞄准点，x = −0.8</text>
  <text x="75" y="1135" class="small">target：弹道在 x = 0.1 的预测拦截点</text>
  <text x="75" y="1164" class="small">元数据 → env._full_goal_shots</text>
  <text x="75" y="1193" class="small">reset 时发射、清除状态；飞行中不强制追踪弹道</text>
  <text x="75" y="1225" class="code">scene/events.py</text>

  <path d="M575 1120 H625" class="arrow"/>
  <rect x="630" y="1010" width="495" height="240" rx="12" class="amber"/>
  <text x="650" y="1041" class="heading">两类运行状态 · 不要混淆</text>
  <text x="650" y="1077" class="body">shot_state.py：奖励事件记忆</text>
  <text x="650" y="1106" class="small">停球 / 触达 flag、单步缓存、恢复阶段 mask</text>
  <text x="650" y="1145" class="body">outcomes.py：射门结果记忆</text>
  <text x="650" y="1174" class="small">进球、出界 → shot_resolved + 记录时刻</text>
  <text x="650" y="1206" class="small">状态按环境保存；reset 只清除对应环境</text>
  <text x="650" y="1233" class="small">注意：shot_resolved 目前不等同于“成功挡球”</text>

  <path d="M1125 1120 H1175" class="arrow"/>
  <rect x="1180" y="1010" width="565" height="240" rx="12" class="green"/>
  <text x="1200" y="1041" class="heading">Reward / Termination Manager</text>
  <text x="1200" y="1077" class="small">22 项奖励：基础约束、脚部、扑救、恢复</text>
  <text x="1200" y="1106" class="small">射门 resolved 后关闭 reach / success / stopball</text>
  <text x="1200" y="1135" class="small">恢复奖励使用 recovery mask；其他项继续计算</text>
  <text x="1200" y="1174" class="small">终止：最大超时 / resolved 后 2 s / 倾斜超过 60°</text>
  <text x="1200" y="1205" class="small">终止环境自动 reset，其他并行环境继续运行</text>
  <text x="1200" y="1233" class="code">mdp/{rewards,terminations}.py</text>
  <path d="M1745 790 H1757 V990 H1730 V1010" class="arrow"/>

  <path d="M1460 1250 V1285 H1115 V1310" class="arrow"/>
  <rect x="55" y="1315" width="1070" height="125" rx="12" class="blue"/>
  <text x="75" y="1346" class="heading">Rollout → PPO 更新 Actor / Critic</text>
  <text x="75" y="1380" class="body">收集 obs、action、reward、done、value → 回报 / GAE → 优化网络参数</text>
  <text x="75" y="1414" class="small">每次迭代：num_envs × 24 个 transition；例如 128 × 24 = 3072</text>
  <path d="M880 1315 V1280 H605 V670 H630" class="arrow"/>

  <path d="M1125 1380 H1175" class="arrow"/>
  <rect x="1180" y="1315" width="565" height="125" rx="12" class="panel"/>
  <text x="1200" y="1346" class="heading">训练产物与检查</text>
  <text x="1200" y="1380" class="small">logs/rsl_rl/k1_goalkeeper/：模型、参数、TB 日志</text>
  <text x="1200" y="1414" class="small">scripts/play.py → Viser；导出模型 → 后续部署</text>

  <text x="55" y="1480" class="small">一个控制步的主要顺序：action → 4 次物理步 → termination → reward → step events → 按需 reset → 新观测</text>
  <text x="55" y="1515" class="small">termination 内已主动更新射门结果，使本步 reward 能读到最新 resolved；状态缓存避免同一步重复计奖。</text>

  <!-- Offline and future branches -->
  <rect x="30" y="1575" width="1740" height="435" rx="18" class="panel"/>
  <text x="55" y="1615" class="section">③ 已有离线资产与待接入模块：这些还没有进入上面的 PPO 闭环</text>

  <rect x="55" y="1645" width="520" height="240" rx="12" class="green"/>
  <text x="75" y="1676" class="heading">已完成：G1 → K1 动作重定向</text>
  <text x="75" y="1712" class="small">G1 motion + URDF → FK → 身体比例调整</text>
  <text x="75" y="1742" class="small">→ K1 串联 IK：22 关节 → 并联踝 IK：34 关节</text>
  <text x="75" y="1772" class="small">并联 34 是关节状态数，不是 34 维电机动作</text>
  <text x="75" y="1807" class="code">motion/goalkeeper_retarget.py</text>
  <text x="75" y="1836" class="code">robots/booster_k1/parallel_retarget.py</text>
  <text x="75" y="1865" class="small">产物：artifacts/goalkeeper_k1/{serial,parallel}/*.pkl</text>

  <path d="M575 1760 H625" class="dasharrow"/>
  <rect x="630" y="1645" width="495" height="240" rx="12" class="planned"/>
  <text x="650" y="1676" class="heading">待接入：参考动作 / AMP 学习</text>
  <text x="650" y="1712" class="small">参考 clip → 动作特征、采样、历史窗口</text>
  <text x="650" y="1742" class="small">判别器 / 风格奖励 → 与任务奖励组合</text>
  <text x="650" y="1772" class="small">再接入训练 Runner；不是只有 reward 函数</text>
  <text x="650" y="1810" class="small">当前六个 K1 clip 尚未用于训练</text>
  <text x="650" y="1840" class="small">现有 tracking task 不属于当前调用链</text>
  <text x="650" y="1868" class="small">不必先完成 tracking 训练才能接入 AMP</text>

  <rect x="1180" y="1645" width="565" height="240" rx="12" class="planned"/>
  <text x="1200" y="1676" class="heading">待接入：真实视觉与真机适配</text>
  <text x="1200" y="1712" class="small">RGB-D / 视觉服务 → 球位置估计与有效标记</text>
  <text x="1200" y="1742" class="small">IMU / 编码器 → 同口径的身体状态观测</text>
  <text x="1200" y="1772" class="small">SDK 或 ROS2 → 部署适配器 → policy 推理</text>
  <text x="1200" y="1802" class="small">→ 关节目标 / 电机控制 + 安全保护</text>
  <text x="1200" y="1840" class="small">对齐观测顺序、坐标系、历史、归一化、控制频率</text>
  <text x="1200" y="1868" class="small">复用训练时的输入 / 输出约定，不切换两套 Actor</text>

  <text x="55" y="1930" class="body">阅读方式：① 看配置依赖；② 看策略如何真正驱动机器人；③ 看参考动作与部署还缺哪些连接。</text>
  <text x="55" y="1970" class="small">范围说明：这是当前代码架构，不表示机器人已学会稳定站立或挡球；奖励事件也不能直接当作真实扑救成功率。</text>
</svg>
