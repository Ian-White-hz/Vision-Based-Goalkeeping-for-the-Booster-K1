seed: 1
num_steps_per_env: 100
max_iterations: 3000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 200
experiment_name: k1_goalkeeper_source
run_name: source_k1_highreach
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: true
load_run: 2026-11-17_11-28-20_source_k1_upstream_like_cont
load_checkpoint: model_12000.pt
clip_actions: null
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 256
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: rsl_rl.modules.distribution:GaussianDistribution
    init_std: 0.5
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 256
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: PPO
  symmetry_cfg: null
dataset_root: artifacts/goalkeeper_k1/serial_flatfoot
value_smoothness_coef: 0.1
smoothness_upper_bound: 1.0
smoothness_lower_bound: 0.1
